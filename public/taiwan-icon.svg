<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="pinDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Clean rounded icon canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle ground ripple under landmark pin -->
  <ellipse cx="256" cy="420" rx="90" ry="24" fill="#0f172a" fill-opacity="0.35" />

  <!-- Single Landmark Pin Icon (純粹地標符號) -->
  <g filter="url(#pinDropShadow)">
    <!-- Landmark Pin Body -->
    <path d="M 256 70
             C 173 70, 106 137, 106 220
             C 106 312, 232 420, 256 420
             C 280 420, 406 312, 406 220
             C 406 137, 339 70, 256 70 Z"
          fill="url(#pinGrad)"
          stroke="#ffffff"
          stroke-width="12"
          stroke-linejoin="round"/>

    <!-- Inner Core Circle of Landmark Pin -->
    <circle cx="256" cy="216" r="48" fill="#ffffff"/>
  </g>
</svg>
