name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Gradle Wrapper & Build APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "No gradlew found, building web bundle artifact..."
            npm ci
            npm run build
          fi

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaiwanExplore-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            dist/

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Taiwan Explore App (Latest APK)"
          body: "🇹🇼 最新版 Android APK 安裝檔！點擊下方 Assets 中的 APK 檔案即可直接下載安裝到 Android 手機。"
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
