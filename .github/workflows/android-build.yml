name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Environment & Licenses
        run: |
          if [ -f ".env.example" ]; then
            cp .env.example .env
            cp .env.example app/.env 2>/dev/null || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties 2>/dev/null || true
          yes | sdkmanager --licenses || true

      - name: Build APK with Gradle
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaiwanExplore-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Taiwan Explore App v1.0.${{ github.run_number }} (APK)"
          body: "🇹🇼 最新版 Android APK 安裝檔！點擊下方 Assets 中的 APK 檔案即可直接下載安裝到 Android 手機。"
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
