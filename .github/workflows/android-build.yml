name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Environment & Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          fi
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Build APK with Gradle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-reports
          path: app/build/reports/

      - name: Prepare Named APK
        run: |
          mkdir -p release_apk
          for apk in app/build/outputs/apk/debug/*.apk; do
            cp "$apk" "release_apk/Taiwan Fun Tour APP v1.0.${{ github.run_number }}.apk"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taiwan Fun Tour APP (APK)
          path: release_apk/*.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Release Taiwan Fun Tour APP v1.0.${{ github.run_number }}"
          body: "🇹🇼 最新版 Android APK 安裝檔！點擊下方 Assets 中的 Taiwan Fun Tour APP (APK) 檔案即可直接下載安裝到 Android 手機，安裝後手機上應用程式名稱顯示為「臺灣好好玩」。"
          files: release_apk/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
